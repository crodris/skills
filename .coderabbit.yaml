# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# inheritance keeps the settings made in the CodeRabbit web app; without it,
# anything this file does not set falls back to CodeRabbit's defaults.
# Automatic review is off because review-loop's reviewers in .full-send/config.md
# review every pull request here instead, and babysit's bots.md treats a bot whose
# config turns automatic review off as absent.
inheritance: true
reviews:
  auto_review:
    enabled: false
