version: 2

# Reviewed findings accepted as false positives.
# Docs: https://github.com/NVIDIA/SkillSpector/blob/main/docs/SUPPRESSION.md
rules:
  - id: "EA2"
    path: "SKILL.md"
    message: "*without asking*"
    reason: >-
      False positive: "Autonomous Decision Making" matched the scaffold
      hand-off step ("in auto mode, invoke the execute skill on that ref
      without asking and say that you are doing so"). Auto mode is an explicit
      user-selected setting, the hand-off is announced to the user, and the
      action is invoking another skill, not a destructive or financial
      operation. Caution: the message field matches only the flagged text, so
      this rule suppresses ANY "without asking" EA2 hit in any SKILL.md of
      this plugin, including future ones this reason does not cover; when
      adding that phrase to a skill, re-review whether the suppression still
      only hides benign uses. Re-reviewed for html-comms:
      "publish every page ... without asking" sends a new page only to a
      private target, the harness's own private publisher or a here.now Site
      locked to owner-only (restricted, empty allowlists) before the real page
      goes up, and falls back to the local path when neither is available.
      An update to a Site anyone beyond the owner can open asks first. The page
      leaves out secrets, private URLs, and local paths, and the only
      deletion is of the placeholder Site that same run created.

  # skills/execute/README.md is the human guide to Fathom, moved there from
  # docs/fathom.md. No SKILL.md loads it as instructions; memory.md and
  # memory/beads.md only name its sections for the user to follow. Each rule
  # below names the rule id and the flagged text it covers, so a new finding in
  # that file still fails.

  - id: "AS2"
    path: "README.md"
    message: "*read OAuth token*"
    reason: >-
      False positive: the security boundary section reports that a test run
      with its tracker MCP disabled tried to edit mcp.json and read OAuth token
      caches, as the reason the skills refuse instead. It describes behavior
      the skills forbid.

  - id: "EA2"
    path: "README.md"
    message: "*without asking*"
    reason: >-
      False positive: the guide explains auto mode to the user (loading a
      profile the branch already carries, the scaffold hand-off, and applying
      a proposed stack split). Auto mode is a setting the user picks, and the
      same behavior is covered by the SKILL.md rule above.

  - id: "RA2"
    path: "README.md"
    message: "*generic-git fallback still pushes*"
    reason: >-
      False positive: the prerequisites line says the generic-git fallback
      pushes the branch and hands the review to the user. It persists nothing
      across sessions.

  - id: "RA2"
    path: "README.md"
    message: "*forges/TEMPLATE.md*"
    reason: >-
      False positive: the forge section tells the user to copy the adapter
      template into their own repository. The user does the write, by hand.

  - id: "RP1"
    path: "README.md"
    message: "*npx skills*"
    reason: >-
      False positive: RP1 flags the guide's `npx skills@latest add
      crodris/skills` and `npx skills update` install lines, which a person
      runs to install or update these skills. Following the latest release is
      the intended install path, and the README at the repository root shows
      the same commands.

  # fathom-shared carries the contract files execute and scaffold read;
  # its SKILL.md exists so directory-copying installers (npx skills) bring it
  # along. Scanning it flags documentation text, not executable skill behavior.

  - id: "EA2"
    path: "memory.md"
    message: "*Do not ask*"
    reason: >-
      False positive: matched the backend-resolution rule ("Do not ask the
      user to choose a backend; resolution is a silent probe"). Picking
      which task-memory backend to read is a read-only precedence decision;
      every consequential action still runs through approval.md's stops.

  - id: "TM1"
    path: "trackers.md"
    message: "*rm -f -- .fathom/config.md*"
    reason: >-
      False positive: first-run setup names `git clean -f -- .fathom/config.md`
      and `git rm -f -- .fathom/config.md` to remove an uncommitted profile
      copy only after comparing it with the issue branch's tracked copy and
      finding them identical, so git can switch branches. Both are scoped to
      that one path, and the same line forbids `git checkout -f`, which would
      discard tracked changes.

  - id: "EA2"
    path: "trackers.md"
    message: "*without asking*"
    reason: >-
      False positive: the flagged line is the first-run setup QUESTION that
      asks the user to choose an approval mode ("stop for approval ... or
      run straight through without asking"). It is literally a
      human-in-the-loop prompt; "without asking" names the option offered,
      not behavior taken unilaterally.

  - id: "PE3"
    path: "conventions.md"
    message: "*credentials.yml*"
    reason: >-
      False positive: matched the staging-safety PROHIBITION list, which
      names .env files, credential stores, and key files precisely to
      forbid staging them. The rule instructs the agent to stop and ask;
      nothing reads or transmits credentials.

  - id: "PE3"
    path: "trackers/asana.md"
    message: "*access token*"
    reason: >-
      False positive: the line documents merge-closer Action setup and
      tells the USER to add an ASANA_TOKEN repository secret in GitHub
      settings. The skill never reads or handles the token; the absolute
      boundary in both entry skills forbids credential access. The offer
      is now gated on the resolved forge declaring ciHooks, so it is only
      reachable on a forge that can run the workflow at all.

  - id: "E1"
    path: "trackers/asana.md"
    message: "*app.asana.com*"
    reason: >-
      Reviewed, intentional: the flagged curl is inside the OPTIONAL
      merge-closer GitHub Action template that the user may install into
      their own repo, and is only offered when the resolved forge declares
      ciHooks. It posts a task-completion update to Asana's documented API
      using a repository secret the user configured for exactly that
      purpose. The skills themselves never run it; the absolute boundary
      forbids them from calling tracker HTTP APIs.

  - id: "E1"
    path: "trackers/linear.md"
    message: "*api.linear.app*"
    reason: >-
      Reviewed, intentional: same as the Asana rule - the flagged curl is
      the Linear variant of the optional merge-closer Action template,
      calling Linear's documented GraphQL API with the user's own
      repository secret. Never executed by the skills.

  - id: "RP1"
    path: "agents.md"
    message: "*npx skills*"
    reason: >-
      Reviewed, intentional: the install instruction uses the skills.sh
      CLI (npx skills add). Pinning an exact CLI version here would go
      stale and is not a security boundary; the command runs on the USER's
      machine at install time by their choice, and the installed content
      is this repository itself.

  - id: "RP1"
    path: "SKILL.md"
    message: "*npx skills*"
    reason: >-
      Reviewed, intentional: frontend-design-pipeline prints skills.sh
      install commands (npx skills@latest add) for the companion skills
      its stages call, and execute and scaffold print fathom-shared's
      install command when it is missing. html-comms tells the user to
      run the here-now install command and moves on to its next
      publisher. Each is for the user to run, and
      frontend-design-pipeline says never to run one itself. Same
      reasoning as the agents.md rule above: pinning the CLI goes stale
      and is not a security boundary. Caution: path "SKILL.md" matches
      every skill's SKILL.md, so this hides any RP1 "npx skills" hit
      repo-wide; re-review before adding an npx skills command that a
      skill executes itself.

  - id: "AS2"
    path: "trackers/linear.md"
    message: "*mcp.json*"
    reason: >-
      False positive: "MCP Config Access" matched the Kiro setup line, which
      tells the USER to add a Linear MCP server entry to their own mcp.json.
      The skills never read, write, or enumerate any MCP config file; the
      connection is confirmed only through the Linear MCP's own tool call.

  - id: "TR2"
    path: "SKILL.md"
    message: "*current branch*conflicts with built-in command 'branch'*"
    reason: >-
      False positive: "Shadow Command Trigger" matched ship's description,
      which says "the current branch", meaning the git branch being shipped.
      No skill here claims a /branch trigger or shadows that command.
      Caution: path "SKILL.md" matches every skill's SKILL.md, so this hides
      any TR2 'branch' hit whose description clause says "current branch"
      repo-wide; re-review before a skill description names /branch as a
      trigger.

  - id: "RA2"
    path: "SKILL.md"
    message: "*asks to draft, write, rewrite, or polish prose*"
    reason: >-
      Reviewed, intentional: the "Session Persistence" pattern for writes
      into a hidden home directory matched in rewrite, starting at the "write"
      inside the skill's own name on the frontmatter `name:` line and
      running across lines to the `~/.config/voice/config.md` path under
      "Reading the voice files". That path is rewrite's config
      directory (`$XDG_CONFIG_HOME/voice`, falling back to `~/.config/voice`),
      which persists across sessions by design. rewrite creates it with the
      user during first-run setup, the user can read every file in it, and
      it holds only the config's path lists, voice rules, and samples.
      Unprompted writes stay inside it, other writes need the user's approval
      of the specific change, and rewrite defines no cron jobs or startup
      scripts. Caution: path "SKILL.md" matches every skill's SKILL.md, so
      this hides any RA2 hit repo-wide whose first 200 characters contain
      the opening of rewrite's description. The pattern's match also spans
      newlines up to the first `|` in the file, and rewrite's SKILL.md has
      none, while the reported finding text is only the first 200
      characters, so any new "write/create/mkdir ... ~/.<dir>" line added
      anywhere in rewrite's SKILL.md is swallowed into this same match and
      stays suppressed; re-review this rule whenever rewrite gains a new
      hidden-directory path. setup.md holds the writes themselves: the
      config directory is the one place rewrite writes on its own, it
      refuses symlinks out of it, and any other write needs the user's
      approval of the specific change.

  - id: "AS1"
    path: "setup.sh"
    message: "*/.claude/settings*"
    reason: >-
      False positive: "Agent Config Directory Access" matched worktree-setup's
      copy list, which copies the repository's own untracked
      `.claude/settings.local.json` from the main checkout into a linked
      worktree of the same repository on the same machine, only when the
      worktree lacks one. It never parses or prints the file, never touches
      the user's ~/.claude directory, grants no permission that checkout
      does not already have, and sends nothing off the machine. Caution: the
      finding text is only "/.claude/settings", so this rule suppresses ANY
      AS1 hit on a .claude/settings path in setup.sh, including settings.json;
      re-review it if the script ever reads such a file or copies it anywhere
      else.

  - id: "AE1"
    path: "SKILL.md"
    message: "*trackers.md (partial)*"
    reason: >-
      Coverage limit, not evasion: fathom-shared's SKILL.md lists trackers.md,
      and the static layer marks that file partial when its directive
      reconstruction hits a limit (for example more than 8 active directives
      in one window, MAX_ACTIVE_DIRECTIVES in SkillSpector's
      security_reconstruction.py), which it reports as
      "obfuscated_instruction_text". trackers.md is this repo's own contract
      prose with no encoded or split-letter text; one ordinary rule sentence
      added to its dense profile section was enough to trigger it. Caution: this
      also hides a real partial analysis of trackers.md, so re-review the
      file's diff by hand when it changes.

  - id: "RP1"
    path: "boundary.md"
    message: "*npx skills*"
    reason: >-
      Reviewed, intentional: ship/boundary.md's Missing skills section holds
      the one install command (npx skills@latest add crodris/skills -s ship
      prove file-pr babysit review-loop land) that every skill in the ship
      family gives the user when a sibling is missing. The user runs it; no
      skill runs it itself. Same reasoning as the SKILL.md rule above:
      pinning the CLI goes stale and is not a security boundary. Scoped to
      boundary.md, so an npx skills hit in another ship file still fails.

  - id: "TM1"
    path: "guard.sh"
    message: "*git push --force*"
    reason: >-
      Reviewed, intentional: ship's guard.sh force-pushes only when its caller
      passes a lease SHA, and then only with --force-with-lease pinned to that
      SHA, after checking that the checkout is the shipping branch and not the
      base. babysit passes the lease only for a base rebase and for the
      autosquash push before READY, both on a branch this run created, as
      boundary.md requires. bin/test-guard.sh
      covers the refusals and a stale lease failing.

  - id: "TM1"
    path: "cleanup.sh"
    message: "*git push --force*"
    reason: >-
      Reviewed, intentional: land's cleanup.sh deletes the merged branch on
      the remote only with --force-with-lease pinned to the merged head, so a
      commit pushed after its tip check makes the delete fail instead of
      erasing that commit. It pushes nothing else, and only after the forge
      reports the pull request merged from that branch. bin/test-land.sh
      covers a push landing after the check.

  - id: "LP3"
    path: "SKILL.md"
    message: "*capabilities were detected: file_read.*"
    reason: >-
      Reviewed, intentional: prove's resolve-verify.sh reads the repository's
      own manifests (package.json, Makefile, CI workflows) to print verify
      candidates, and runs nothing it finds. Declaring allowed-tools would
      pre-approve tools in Claude Code, which widens what the skill may do
      instead of narrowing it. The glob ends on "file_read." so a skill whose
      scripts also show shell, network, file_write, or env capabilities still
      fails.
      Caution: path "SKILL.md" matches every skill's SKILL.md, so re-review
      this rule when another skill gains a script that reads files.
