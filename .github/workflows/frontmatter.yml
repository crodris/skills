name: Frontmatter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontmatter:
    name: Skill frontmatter parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the frontmatter check against scratch repositories
        run: bin/test-check-frontmatter.sh

      - name: Check every skill's frontmatter
        run: bin/check-frontmatter.sh

      - name: Check the version sync against a scratch repository
        run: bin/test-sync-versions.sh

      - name: Check versions are in sync
        run: bin/sync-versions.sh && git diff --exit-code
